<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>绿植养护数据库</title><meta name="description" content="按植物、信息来源和介质筛选养护记录：图片、光照、温度、水分、NPK、EC、肥料用量及添加剂。"><link rel="stylesheet" href="database.css"></head><body>
